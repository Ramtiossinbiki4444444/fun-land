<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سنگ کاغذ قیچی | فان لند</title>
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #1689e8; --blue-2: #0875d1; --blue-soft: #e8f4ff; --blue-line: #d7eaff; --navy: #10263d; --text: #1b3045; --muted: #71849a; --bg: #f5f9ff; --border: #e5edf6; --shadow: 0 25px 80px rgba(26, 86, 139, .12); --shadow-small: 0 10px 30px rgba(26, 86, 139, .06); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%), var(--bg); }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(var(--blue-line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.4; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }
    .container { width: min(620px, calc(100% - 40px)); margin-inline: auto; }
    .header-nav { padding: 24px 0 10px; display: flex; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: var(--shadow-small); }
    .back-btn:hover { color: var(--blue-2); transform: translateX(5px); box-shadow: 0 12px 25px rgba(22,137,232,0.12); border-color: var(--blue-line); background: #fff; }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    .tool-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px; padding: 40px 35px; box-shadow: var(--shadow); text-align: center; position: relative; overflow: hidden; width: 100%; }
    .tool-card::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); opacity: 0.6; }
    .icon-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 24px; display: grid; place-items: center; }
    .icon-glow { position: absolute; inset: -10px; background: var(--blue-soft); border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate; }
    .icon-box { width: 80px; height: 80px; background: #fff; color: var(--blue); border: 1px solid var(--blue-line); border-radius: 24px; display: grid; place-items: center; position: relative; z-index: 1; box-shadow: 0 10px 25px rgba(22,137,232,0.15); }
    .icon-box svg { width: 38px; height: 38px; }
    @keyframes pulse-glow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0.9; } }
    h1 { margin: 0 0 10px; font-size: 1.8rem; color: var(--navy); font-weight: 900; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 30px; color: var(--muted); font-size: 0.95rem; }
    .choices { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
    .choice { width: 80px; height: 80px; background: #f9fbfe; border: 2px solid var(--border); border-radius: 20px; font-size: 2.5rem; cursor: pointer; transition: 0.2s; display: grid; place-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .choice:hover { background: var(--blue-soft); border-color: var(--blue); transform: translateY(-3px); }
    .result { display: none; margin-top: 20px; animation: slideUp .6s cubic-bezier(0.16, 1, 0.3, 1); }
    .result.show { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .hands { display: flex; justify-content: center; gap: 30px; align-items: center; margin-bottom: 15px; }
    .hand { font-size: 3.5rem; }
    .score-message { font-size: 1.2rem; font-weight: 900; color: var(--navy); }
  </style>
</head>
<body>
  <header class="container header-nav">
    <a href="tools.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
      بازگشت به ابزارها
    </a>
  </header>
  <main class="container">
    <div class="tool-card">
      <div class="icon-wrapper">
        <div class="icon-glow"></div>
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
      </div>
      <h1>سنگ کاغذ قیچی</h1>
      <p class="sub">انتخاب کن و با ربات بازی کن!</p>
      <div class="choices">
        <div class="choice" onclick="play('سنگ', '✊')">✊</div>
        <div class="choice" onclick="play('کاغذ', '✋')">✋</div>
        <div class="choice" onclick="play('قیچی', '✌️')">✌️</div>
      </div>
      <div class="result" id="result">
        <div class="hands">
          <div><div style="font-size:0.9rem;color:var(--muted)">تو</div><div class="hand" id="userHand">❓</div></div>
          <div style="font-weight:900;color:var(--muted)">VS</div>
          <div><div style="font-size:0.9rem;color:var(--muted)">ربات</div><div class="hand" id="cpuHand">❓</div></div>
        </div>
        <div class="score-message" id="msg"></div>
      </div>
    </div>
  </main>
  <script>
    function play(user, icon) {
      const options = [{n:'سنگ', i:'✊'}, {n:'کاغذ', i:'✋'}, {n:'قیچی', i:'✌️'}];
      const cpu = options[Math.floor(Math.random() * 3)];
      document.getElementById('userHand').textContent = icon;
      document.getElementById('cpuHand').textContent = cpu.i;
      
      const msg = document.getElementById('msg');
      if(user === cpu.n) { msg.textContent = 'مساوی! 🤝'; msg.style.color = 'var(--muted)'; }
      else if ((user === 'سنگ' && cpu.n === 'قیچی') || (user === 'کاغذ' && cpu.n === 'سنگ') || (user === 'قیچی' && cpu.n === 'کاغذ')) {
        msg.textContent = 'بردی! 🎉'; msg.style.color = '#28a745';
      } else {
        msg.textContent = 'باختی! 😢'; msg.style.color = '#ee5253';
      }
      document.getElementById('result').classList.add('show');
    }
  </script>
</body>
</html>
