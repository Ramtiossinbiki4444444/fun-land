<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>گردونه شانس | فان لند</title>
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #1689e8; --blue-2: #0875d1; --blue-soft: #e8f4ff; --blue-line: #d7eaff; --navy: #10263d; --text: #1b3045; --muted: #71849a; --bg: #f5f9ff; --border: #e5edf6; --shadow: 0 25px 80px rgba(26, 86, 139, .12); --shadow-small: 0 10px 30px rgba(26, 86, 139, .06); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%), var(--bg); }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(var(--blue-line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.4; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }
    .container { width: min(620px, calc(100% - 40px)); margin-inline: auto; }
    .header-nav { padding: 24px 0 10px; display: flex; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: var(--shadow-small); }
    .back-btn:hover { color: var(--blue-2); transform: translateX(5px); box-shadow: 0 12px 25px rgba(22,137,232,0.12); border-color: var(--blue-line); background: #fff; }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    .tool-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px; padding: 40px 35px; box-shadow: var(--shadow); text-align: center; position: relative; overflow: hidden; width: 100%; }
    .tool-card::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); opacity: 0.6; }
    .icon-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 24px; display: grid; place-items: center; }
    .icon-glow { position: absolute; inset: -10px; background: var(--blue-soft); border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate; }
    .icon-box { width: 80px; height: 80px; background: #fff; color: var(--blue); border: 1px solid var(--blue-line); border-radius: 24px; display: grid; place-items: center; position: relative; z-index: 1; box-shadow: 0 10px 25px rgba(22,137,232,0.15); }
    .icon-box svg { width: 38px; height: 38px; }
    @keyframes pulse-glow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0.9; } }
    h1 { margin: 0 0 10px; font-size: 1.8rem; color: var(--navy); font-weight: 900; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 30px; color: var(--muted); font-size: 0.95rem; }
    input { width: 100%; padding: 16px; border: 2px solid var(--border); background: #f9fbfe; border-radius: 16px; font: inherit; font-size: 1rem; font-weight: 600; outline: none; text-align: center; transition: all 0.25s; margin-bottom: 20px; }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 5px rgba(22,137,232,.1); background: #fff; }
    .btn { width: 100%; padding: 16px; border: 0; border-radius: 16px; font: inherit; font-weight: 900; font-size: 1.1rem; color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-2)); cursor: pointer; transition: all 0.3s; box-shadow: 0 12px 25px rgba(22,137,232,.25); margin-bottom: 20px; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(22,137,232,.35); }
    
    .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto; }
    .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--blue); z-index: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 0 6px #fff, var(--shadow); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
    
    .result { display: none; margin-top: 25px; animation: slideUp .6s; }
    .result.show { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .score-message { font-size: 1.2rem; font-weight: 900; color: var(--navy); }
  </style>
</head>
<body>
  <header class="container header-nav">
    <a href="tools.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg> بازگشت</a>
  </header>
  <main class="container">
    <div class="tool-card">
      <div class="icon-wrapper"><div class="icon-glow"></div><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 7v5l3 2"/></svg></div></div>
      <h1>گردونه شانس</h1>
      <p class="sub">اسم‌ها رو با کاما (,) جدا کن تا یکی رو شانسی انتخاب کنیم!</p>
      <input type="text" id="names" placeholder="مثلاً: علی، رضا، سارا، مریم" value="علی, رضا, سارا, مریم">
      <button class="btn" onclick="spin()">بچرخون!</button>
      
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
      </div>
      
      <div class="result" id="result">
        <div class="score-message" id="resText"></div>
      </div>
    </div>
  </main>
  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ['#1689e8', '#ee5253', '#0abde3', '#10ac84', '#f368e0', '#ff9f43', '#576574', '#c8d6e5'];
    let currentRotation = 0;
    let isSpinning = false;
    
    function drawWheel(names) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;
      const sliceAngle = (2 * Math.PI) / names.length;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      names.forEach((name, i) => {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;
        
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        
        // نوشتن متن روی برش
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Vazirmatn, Tahoma';
        ctx.fillText(name, radius - 30, 8); // فاصله از لبه
        ctx.restore();
      });
    }

    function spin() {
      if(isSpinning) return;
      const input = document.getElementById('names').value.trim();
      if(!input) { alert('چند تا اسم بنویس!'); return; }
      
      const names = input.split(',').map(n => n.trim()).filter(n => n);
      if(names.length < 2) { alert('حداقل ۲ اسم وارد کن!'); return; }
      
      isSpinning = true;
      document.getElementById('result').classList.remove('show');
      
      // رسم گردونه با اسم‌های جدید
      drawWheel(names);
      
      const randomIndex = Math.floor(Math.random() * names.length);
      const winner = names[randomIndex];
      
      // محاسبه زاویه برای برنده شدن
      const sliceAngle = 360 / names.length;
      // زاویه‌ای که باید بچرخه تا فلش روی مرکز برنده بیفته
      const targetAngle = 360 - (randomIndex * sliceAngle) - (sliceAngle / 2);
      
      const extraSpins = 5 + Math.random() * 5;
      const totalRotation = currentRotation + (extraSpins * 360) + targetAngle - (currentRotation % 360);
      
      currentRotation = totalRotation;
      canvas.style.transform = `rotate(${totalRotation}deg)`;
      
      setTimeout(() => {
        document.getElementById('resText').innerHTML = `🎉 برنده: <span style="color:${colors[randomIndex % colors.length]}">${winner}</span>`;
        document.getElementById('result').classList.add('show');
        isSpinning = false;
      }, 4000);
    }
    
    // رسم اولیه با مقادیر پیش‌فرض
    window.onload = () => {
      const input = document.getElementById('names').value;
      drawWheel(input.split(',').map(n => n.trim()));
    };
  </script>
</body>
</html>
