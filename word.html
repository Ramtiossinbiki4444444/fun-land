<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نقشه تعاملی جهان | فان لند</title>
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --blue: #1689e8; --blue-2: #0875d1; --blue-soft: #e8f4ff; --blue-line: #d7eaff; 
      --navy: #10263d; --text: #1b3045; --muted: #71849a; --bg: #f5f9ff; --border: #e5edf6; 
      --shadow: 0 25px 80px rgba(26, 86, 139, .12); --shadow-small: 0 10px 30px rgba(26, 86, 139, .06); 
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%), var(--bg); }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(var(--blue-line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.4; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }
    
    .container { width: min(1100px, calc(100% - 40px)); margin-inline: auto; }
    .header-nav { padding: 24px 0 10px; display: flex; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: var(--shadow-small); }
    .back-btn:hover { color: var(--blue-2); transform: translateX(5px); box-shadow: 0 12px 25px rgba(22,137,232,0.12); border-color: var(--blue-line); background: #fff; }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }
    
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    .tool-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px; padding: 35px; box-shadow: var(--shadow); text-align: center; position: relative; width: 100%; }
    .tool-card::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); opacity: 0.6; }
    
    .icon-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 20px; display: grid; place-items: center; }
    .icon-glow { position: absolute; inset: -10px; background: var(--blue-soft); border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate; }
    .icon-box { width: 80px; height: 80px; background: #fff; color: var(--blue); border: 1px solid var(--blue-line); border-radius: 24px; display: grid; place-items: center; position: relative; z-index: 1; box-shadow: 0 10px 25px rgba(22,137,232,0.15); }
    .icon-box svg { width: 38px; height: 38px; }
    @keyframes pulse-glow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0.9; } }
    
    h1 { margin: 0 0 5px; font-size: 1.8rem; color: var(--navy); font-weight: 900; }
    p.sub { margin: 0 0 25px; color: var(--muted); font-size: 0.95rem; }

    /* بخش نقشه */
    .map-container { width: 100%; background: #eaf4ff; border-radius: 20px; position: relative; overflow: hidden; border: 1px solid var(--blue-line); box-shadow: inset 0 0 20px rgba(22,137,232,0.05); padding-bottom: 50%; }
    #worldMap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    
    /* استایل کشورها */
    .country-path { 
      fill: #a0c4e0; 
      stroke: #fff; 
      stroke-width: 0.5px; 
      transition: fill 0.3s, filter 0.3s; 
      cursor: pointer; 
    }
    .country-path:hover { 
      fill: var(--blue); 
      filter: drop-shadow(0 0 8px rgba(22,137,232,0.6)); 
    }

    /* باکس اطلاعات */
    .info-box {
      margin-top: 20px; padding: 20px; background: #fff; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow-small); text-align: center; display: none; animation: fadeUp 0.3s;
    }
    .info-box.show { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    
    .info-title { font-size: 1.4rem; font-weight: 900; color: var(--navy); margin-bottom: 15px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .info-item { background: #f9fbfe; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .info-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 3px; }
    .info-value { font-size: 1rem; color: var(--navy); font-weight: 800; }

    /* توالت (Tooltip) */
    #tooltip {
      position: fixed; pointer-events: none; background: rgba(16, 38, 61, 0.95); color: #fff; 
      padding: 8px 15px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; 
      z-index: 1000; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); backdrop-filter: blur(5px);
      max-width: 250px; text-align: right;
    }

    @media (max-width: 768px) {
      .tool-card { padding: 25px 15px; }
      .map-container { padding-bottom: 60%; }
    }
  </style>
</head>
<body>
  <header class="container header-nav">
    <a href="tools.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
      بازگشت به ابزارها
    </a>
  </header>

  <main class="container">
    <div class="tool-card">
      <div class="icon-wrapper">
        <div class="icon-glow"></div>
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
        </div>
      </div>
      
      <h1>نقشه تعاملی جهان</h1>
      <p class="sub">روی هر کشوری کلیک کن تا اطلاعاتش رو ببینی!</p>

      <div class="map-container" id="mapContainer">
        <svg id="worldMap" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <!-- باکس اطلاعات کشور انتخاب شده -->
      <div class="info-box" id="infoBox">
        <div class="info-title" id="infoTitle"></div>
        <div class="info-grid">
          <div class="info-item"><span class="info-label">پایتخت</span><span class="info-value" id="infoCapital">-</span></div>
          <div class="info-item"><span class="info-label">جمعیت</span><span class="info-value" id="infoPop">-</span></div>
          <div class="info-item"><span class="info-label">واحد پول</span><span class="info-value" id="infoCurrency">-</span></div>
          <div class="info-item"><span class="info-label">قاره</span><span class="info-value" id="infoRegion">-</span></div>
        </div>
      </div>
    </div>
  </main>

  <div id="tooltip"></div>

  <script>
    // دیتابیس اطلاعات کشورها (فقط چند کشور مهم برای نمونه)
    // بقیه کشورها فقط اسمشون (id) نمایش داده میشه.
    const countriesDB = {
      'IRN': { name: 'ایران', capital: 'تهران', pop: '۸۵,۰۰۰,۰۰۰', currency: 'ریال (﷼)', region: 'خاورمیانه' },
      'USA': { name: 'ایالات متحده', capital: 'واشینگتن', pop: '۳۳۱,۰۰۰,۰۰۰', currency: 'دلار ($)', region: 'آمریکای شمالی' },
      'IND': { name: 'هند', capital: 'دهلی نو', pop: '۱,۴۰۰,۰۰۰,۰۰۰', currency: 'روپیه (₹)', region: 'آسیا' },
      'CHN': { name: 'چین', capital: 'پکن', pop: '۱,۴۰۰,۰۰۰,۰۰۰', currency: 'یوان (¥)', region: 'آسیا' },
      'PAK': { name: 'پاکستان', capital: 'اسلام‌آباد', pop: '۲۲۵,۰۰۰,۰۰۰', currency: 'روپیه (₨)', region: 'آسیا' },
      'NGA': { name: 'نیجریه', capital: 'آبوجا', pop: '۲۱۰,۰۰۰,۰۰۰', currency: 'نایرا (₦)', region: 'آفریقا' },
      'BRA': { name: 'برزیل', capital: 'برازیلیا', pop: '۲۱۴,۰۰۰,۰۰۰', currency: 'رئال (R$)', region: 'آمریکای جنوبی' },
      'IDN': { name: 'اندونزی', capital: 'جاکارتا', pop: '۲۷۰,۰۰۰,۰۰۰', currency: 'روپیه (Rp)', region: 'آسیا' },
      'EGY': { name: 'مصر', capital: 'قاهره', pop: '۱۰۴,۰۰۰,۰۰۰', currency: 'پوند (E£)', region: 'آفریقا' },
      'TUR': { name: 'ترکیه', capital: 'آنکارا', pop: '۸۴,۰۰۰,۰۰۰', currency: 'لیر (₺)', region: 'خاورمیانه' },
      'RUS': { name: 'روسیه', capital: 'مسکو', pop: '۱۴۴,۰۰۰,۰۰۰', currency: 'روبل (₽)', region: 'اوراسیا' },
      'MEX': { name: 'مکزیک', capital: 'مکزیکوسیتی', pop: '۱۲۸,۰۰۰,۰۰۰', currency: 'پزو ($)', region: 'آمریکای شمالی' },
      'JPN': { name: 'ژاپن', capital: 'توکیو', pop: '۱۲۵,۰۰۰,۰۰۰', currency: 'ین (¥)', region: 'آسیا' },
      'DEU': { name: 'آلمان', capital: 'برلین', pop: '۸۳,۰۰۰,۰۰۰', currency: 'یورو (€)', region: 'اروپا' },
      'GBR': { name: 'انگلستان', capital: 'لندن', pop: '۶۷,۰۰۰,۰۰۰', currency: 'پوند (£)', region: 'اروپا' },
      'FRA': { name: 'فرانسه', capital: 'پاریس', pop: '۶۷,۰۰۰,۰۰۰', currency: 'یورو (€)', region: 'اروپا' },
      'ITA': { name: 'ایتالیا', capital: 'رم', pop: '۵۹,۰۰۰,۰۰۰', currency: 'یورو (€)', region: 'اروپا' },
      'CAN': { name: 'کانادا', capital: 'اتاوا', pop: '۳۸,۰۰۰,۰۰۰', currency: 'دلار (C$)', region: 'آمریکای شمالی' },
      'SAU': { name: 'عربستان', capital: 'ریاض', pop: '۳۴,۰۰۰,۰۰۰', currency: 'ریال (﷼)', region: 'خاورمیانه' },
      'ARE': { name: 'امارات', capital: 'ابوظبی', pop: '۹,۸۰۰,۰۰۰', currency: 'درهم (د.إ)', region: 'خاورمیانه' },
      'ZAF': { name: 'آفریقای جنوبی', capital: 'پرتوریا', pop: '۶۰,۰۰۰,۰۰۰', currency: 'رند (R)', region: 'آفریقا' },
      'ARG': { name: 'آرژانتین', capital: 'بوئنوس آیرس', pop: '۴۵,۰۰۰,۰۰۰', currency: 'پزو ($)', region: 'آمریکای جنوبی' },
      'AUS': { name: 'استرالیا', capital: 'کانبرا', pop: '۲۵,۰۰۰,۰۰۰', currency: 'دلار (A$)', region: 'اقیانوسیه' },
      'ESP': { name: 'اسپانیا', capital: 'مادرید', pop: '۴۷,۰۰۰,۰۰۰', currency: 'یورو (€)', region: 'اروپا' },
    };

    function getCountryData(id, defaultName) {
      if (countriesDB[id]) return countriesDB[id];
      return { name: defaultName || id, capital: 'نامشخص', pop: 'نامشخص', currency: 'نامشخص', region: 'نامشخص' };
    }

    const mapSvg = document.getElementById('worldMap');
    const tooltip = document.getElementById('tooltip');
    const infoBox = document.getElementById('infoBox');

    // 1. لود کردن نقشه
    fetch('https://cdn.jsdelivr.net/npm/@svg-maps/world@1.0.1/world.svg')
      .then(res => res.text())
      .then(svgText => {
        mapSvg.innerHTML = svgText;
        
        document.querySelectorAll('#worldMap path').forEach(path => {
          const id = path.id;
          path.classList.add('country-path');
          
          // اسم کشور رو برای نمایش پیش‌فرض ذخیره کن
          const countryData = getCountryData(id, path.getAttribute('name'));

          // رویداد هاور (نمایش اسم روی موس)
          path.addEventListener('mousemove', (e) => {
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
            tooltip.textContent = countryData.name;
          });
          
          path.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
          });

          // رویداد کلیک (نمایش اطلاعات کامل پایین نقشه)
          path.addEventListener('click', () => {
            document.getElementById('infoTitle').textContent = countryData.name;
            document.getElementById('infoCapital').textContent = countryData.capital;
            document.getElementById('infoPop').textContent = countryData.pop;
            document.getElementById('infoCurrency').textContent = countryData.currency;
            document.getElementById('infoRegion').textContent = countryData.region;
            infoBox.classList.add('show');
          });
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById('mapContainer').innerHTML = '<p style="color:red; padding:20px;">خطا در لود نقشه. لطفاً اتصال اینترنت را بررسی کنید.</p>';
      });
  </script>
</body>
</html>
