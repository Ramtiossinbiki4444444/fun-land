<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9ff">
  <title>ماشین حساب عشق | فان لند</title>
  
  <!-- فاوآیکون سایت -->
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ====== متغیرهای اصلی تم فان لند ====== */
    :root {
      --blue: #1689e8;
      --blue-2: #0875d1;
      --blue-soft: #e8f4ff;
      --blue-line: #d7eaff;
      --navy: #10263d;
      --text: #1b3045;
      --muted: #71849a;
      --bg: #f5f9ff;
      --border: #e5edf6;
      --shadow: 0 25px 80px rgba(26, 86, 139, .12);
      --shadow-small: 0 10px 30px rgba(26, 86, 139, .06);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8;
      min-height: 100vh; display: flex; flex-direction: column;
      position: relative; overflow-x: hidden;
    }

    /* پس‌زمینه با الگوی نقطه‌ای و گرادیان نوری */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background: 
        radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%),
        var(--bg);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: radial-gradient(var(--blue-line) 1px, transparent 1px);
      background-size: 30px 30px; opacity: 0.4;
      mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%);
    }

    .container { width: min(620px, calc(100% - 40px)); margin-inline: auto; }
    
    /* ====== هدر و دکمه بازگشت ====== */
    .header-nav { 
      padding: 24px 0 10px; display: flex; align-items: center; justify-content: space-between; 
    }
    
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; color: var(--navy); 
      text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px);
      padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow-small);
    }
    .back-btn:hover { 
      color: var(--blue-2); 
      transform: translateX(5px); 
      box-shadow: 0 12px 25px rgba(22,137,232,0.12);
      border-color: var(--blue-line);
      background: #fff;
    }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }

    /* ====== کارت اصلی ابزار ====== */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    
    .tool-card {
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px;
      padding: 40px 35px; box-shadow: var(--shadow); text-align: center; 
      position: relative; overflow: hidden; width: 100%;
    }
    
    /* خط نوری بالای کارت */
    .tool-card::before {
      content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      opacity: 0.6;
    }

    /* آیکون قلب با هاله نوری */
    .icon-wrapper {
      position: relative; width: 80px; height: 80px; margin: 0 auto 24px;
      display: grid; place-items: center;
    }
    .icon-glow {
      position: absolute; inset: -10px; background: var(--blue-soft); 
      border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate;
    }
    .icon-heart {
      width: 80px; height: 80px; background: #fff; color: var(--blue);
      border: 1px solid var(--blue-line); border-radius: 24px; 
      display: grid; place-items: center; position: relative; z-index: 1;
      box-shadow: 0 10px 25px rgba(22,137,232,0.15);
    }
    .icon-heart svg { width: 38px; height: 38px; }
    
    @keyframes pulse-glow {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    h1 { margin: 0 0 10px; font-size: 1.8rem; color: var(--navy); font-weight: 900; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 30px; color: var(--muted); font-size: 0.95rem; }

    /* ====== فیلدهای ورودی ====== */
    .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    
    .input-wrapper { position: relative; }
    .input-wrapper svg {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; color: var(--muted-2, #96a6b7); pointer-events: none;
    }
    input {
      width: 100%; padding: 16px 48px 16px 16px; border: 2px solid var(--border); background: #f9fbfe;
      border-radius: 16px; font: inherit; font-size: 1rem; font-weight: 600; outline: none; text-align: right; transition: all 0.25s;
    }
    input::placeholder { color: #a0b2c6; font-weight: 400; }
    input:focus { 
      border-color: var(--blue); box-shadow: 0 0 0 5px rgba(22,137,232,.1); 
      background: #fff; transform: translateY(-2px);
    }

    /* ====== دکمه اصلی ====== */
    .btn {
      width: 100%; padding: 16px; border: 0; border-radius: 16px; font: inherit; font-weight: 900; font-size: 1.1rem;
      color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-2)); 
      cursor: pointer; transition: all 0.3s; box-shadow: 0 12px 25px rgba(22,137,232,.25);
      display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(22,137,232,.35); }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 20px; height: 20px; }

    /* ====== بخش نتیجه ====== */
    .result { display: none; margin-top: 30px; animation: slideUp .6s cubic-bezier(0.16, 1, 0.3, 1); }
    .result.show { display: block; }
    
    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(20px) scale(0.95); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    .score-circle {
      width: 150px; height: 150px; margin: 0 auto 20px; border-radius: 50%;
      display: grid; place-items: center; position: relative;
      background: conic-gradient(var(--blue) var(--percentage), #e5edf6 0);
      transition: background 0.1s linear;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
    }
    .score-inner {
      width: 126px; height: 126px; background: #fff; border-radius: 50%;
      display: grid; place-items: center; font-size: 2.2rem; font-weight: 900; color: var(--blue);
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .score-message { font-size: 1.2rem; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
    .score-desc { color: var(--muted); font-size: 0.95rem; }

    .reset-btn {
      margin-top: 24px; background: #f0f6fc; border: 0; color: var(--blue-2); font: inherit;
      font-size: 0.9rem; font-weight: 800; cursor: pointer; padding: 10px 20px; border-radius: 12px;
      transition: all 0.2s;
    }
    .reset-btn:hover { background: var(--blue-soft); transform: translateY(-2px); }

    @media (max-width: 480px) {
      .container { width: calc(100% - 30px); }
      .tool-card { padding: 30px 20px; border-radius: 26px; }
      h1 { font-size: 1.5rem; }
      .score-circle { width: 130px; height: 130px; }
      .score-inner { width: 110px; height: 110px; font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <!-- هدر و دکمه بازگشت -->
  <header class="container header-nav">
    <a href="tools.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
      بازگشت به ابزارها
    </a>
  </header>

  <main class="container">
    <div class="tool-card">
      
      <!-- آیکون -->
      <div class="icon-wrapper">
        <div class="icon-glow"></div>
        <div class="icon-heart">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
      </div>
      
      <h1>ماشین حساب عشق</h1>
      <p class="sub">اسم خودت و طرف مقابلت رو بنویس تا ببینیم چقدر به هم می‌خورد!</p>

      <!-- ورودی‌ها -->
      <div class="input-group">
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="name1" placeholder="اسم تو..." autocomplete="off">
        </div>
        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="name2" placeholder="اسم طرف مقابل..." autocomplete="off">
        </div>
      </div>

      <!-- دکمه محاسبه -->
      <button class="btn" id="calcBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        محاسبه عشق
      </button>

      <!-- نتیجه -->
      <div class="result" id="result">
        <div class="score-circle" id="scoreCircle">
          <div class="score-inner" id="scoreText">0%</div>
        </div>
        <div class="score-message" id="msgTitle"></div>
        <div class="score-desc" id="msgDesc"></div>
        <button class="reset-btn" id="resetBtn">دوباره امتحان کن</button>
      </div>
      
    </div>
  </main>

  <script>
    const name1 = document.getElementById('name1');
    const name2 = document.getElementById('name2');
    const calcBtn = document.getElementById('calcBtn');
    const result = document.getElementById('result');
    const scoreCircle = document.getElementById('scoreCircle');
    const scoreText = document.getElementById('scoreText');
    const msgTitle = document.getElementById('msgTitle');
    const msgDesc = document.getElementById('msgDesc');

    const messages = [
      { max: 20, title: "اصلاً به هم نمی‌خورید! 💔", desc: "بهتره دنبال یه نفر دیگه بگردی!" },
      { max: 40, title: "فقط در حد رفیق! 🤝", desc: "شاید بشه یه دوستی خوب ساخت." },
      { max: 60, title: "یه ذره امید هست... 🧐", desc: "باید بیشتر تلاش کنی!" },
      { max: 80, title: "خیلی به هم می‌خورد! 😍", desc: "حتماً یه قدم جدی بردار." },
      { max: 100, title: "عشق واقعی! ❤️🔥", desc: "این دیگه تقدیره! زودتر برو خواستگاری." }
    ];

    calcBtn.addEventListener('click', () => {
      const n1 = name1.value.trim();
      const n2 = name2.value.trim();

      if(!n1 || !n2) {
        alert('لطفاً هر دو اسم رو وارد کن!');
        return;
      }

      const combined = (n1 + n2).toLowerCase();
      let hash = 0;
      for (let i = 0; i < combined.length; i++) {
        hash = combined.charCodeAt(i) + ((hash << 5) - hash);
      }
      const percentage = Math.abs(hash % 100) || 1; 

      result.classList.add('show');
      let current = 0;
      
      scoreCircle.style.setProperty('--percentage', `${percentage}%`);

      const interval = setInterval(() => {
        if (current >= percentage) {
          clearInterval(interval);
          current = percentage;
        } else {
          current += Math.ceil(percentage / 20);
          if(current > percentage) current = percentage;
        }
        scoreText.textContent = current + '%';
      }, 40);

      const msg = messages.find(m => percentage <= m.max);
      msgTitle.textContent = msg.title;
      msgDesc.textContent = msg.desc;
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      result.classList.remove('show');
      name1.value = '';
      name2.value = '';
      name1.focus();
      scoreText.textContent = '0%';
      scoreCircle.style.setProperty('--percentage', '0%');
    });
  </script>
</body>
</html>
