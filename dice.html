<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تاس سه بعدی | فان لند</title>
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #1689e8; --blue-2: #0875d1; --blue-soft: #e8f4ff; --blue-line: #d7eaff; --navy: #10263d; --text: #1b3045; --muted: #71849a; --bg: #f5f9ff; --border: #e5edf6; --shadow: 0 25px 80px rgba(26, 86, 139, .12); --shadow-small: 0 10px 30px rgba(26, 86, 139, .06); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%), var(--bg); }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(var(--blue-line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.4; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }
    .container { width: min(620px, calc(100% - 40px)); margin-inline: auto; }
    .header-nav { padding: 24px 0 10px; display: flex; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: var(--shadow-small); }
    .back-btn:hover { color: var(--blue-2); transform: translateX(5px); box-shadow: 0 12px 25px rgba(22,137,232,0.12); border-color: var(--blue-line); background: #fff; }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    
    /* حذف overflow hidden برای اینکه 3D کار کنه */
    .tool-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px; padding: 40px 35px 60px; box-shadow: var(--shadow); text-align: center; position: relative; width: 100%; overflow: visible; }
    .tool-card::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); opacity: 0.6; }
    .icon-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 24px; display: grid; place-items: center; }
    .icon-glow { position: absolute; inset: -10px; background: var(--blue-soft); border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate; }
    .icon-box { width: 80px; height: 80px; background: #fff; color: var(--blue); border: 1px solid var(--blue-line); border-radius: 24px; display: grid; place-items: center; position: relative; z-index: 1; box-shadow: 0 10px 25px rgba(22,137,232,0.15); }
    .icon-box svg { width: 38px; height: 38px; }
    @keyframes pulse-glow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0.9; } }
    h1 { margin: 0 0 10px; font-size: 1.8rem; color: var(--navy); font-weight: 900; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 30px; color: var(--muted); font-size: 0.95rem; }
    
    .btn { width: 100%; padding: 16px; border: 0; border-radius: 16px; font: inherit; font-weight: 900; font-size: 1.1rem; color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-2)); cursor: pointer; transition: all 0.3s; box-shadow: 0 12px 25px rgba(22,137,232,.25); margin-bottom: 40px; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(22,137,232,.35); }
    
    /* کانتینر تاس 3D */
    .dice-container { width: 100px; height: 100px; margin: 0 auto 30px; perspective: 800px; }
    .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1); transform: rotateX(-20deg) rotateY(20deg); }
    
    .face { position: absolute; width: 100px; height: 100px; background: #fff; border: 2px solid var(--blue-line); border-radius: 16px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 12px; box-shadow: inset 0 0 15px rgba(0,0,0,0.05); }
    .dot { width: 16px; height: 16px; background: var(--blue); border-radius: 50%; align-self: center; justify-self: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
    
    /* موقعیت وجه‌ها (نصف عرض ۱۰۰ پیکسل یعنی ۵۰) */
    .front  { transform: translateZ(50px); }
    .back   { transform: rotateY(180deg) translateZ(50px); }
    .right  { transform: rotateY(90deg) translateZ(50px); }
    .left   { transform: rotateY(-90deg) translateZ(50px); }
    .top    { transform: rotateX(90deg) translateZ(50px); }
    .bottom { transform: rotateX(-90deg) translateZ(50px); }
    
    /* چیدمان نقاط */
    .front .dot:nth-child(1) { grid-area: 2 / 2; } 
    .back .dot:nth-child(1) { grid-area: 1 / 1; } .back .dot:nth-child(2) { grid-area: 3 / 3; } 
    .right .dot:nth-child(1) { grid-area: 1 / 1; } .right .dot:nth-child(2) { grid-area: 2 / 2; } .right .dot:nth-child(3) { grid-area: 3 / 3; } 
    .left .dot:nth-child(1) { grid-area: 1 / 1; } .left .dot:nth-child(2) { grid-area: 1 / 3; } .left .dot:nth-child(3) { grid-area: 3 / 1; } .left .dot:nth-child(4) { grid-area: 3 / 3; } 
    .top .dot:nth-child(1) { grid-area: 1 / 1; } .top .dot:nth-child(2) { grid-area: 1 / 3; } .top .dot:nth-child(3) { grid-area: 2 / 2; } .top .dot:nth-child(4) { grid-area: 3 / 1; } .top .dot:nth-child(5) { grid-area: 3 / 3; } 
    .bottom .dot:nth-child(1) { grid-area: 1 / 1; } .bottom .dot:nth-child(2) { grid-area: 1 / 3; } .bottom .dot:nth-child(3) { grid-area: 2 / 1; } .bottom .dot:nth-child(4) { grid-area: 2 / 3; } .bottom .dot:nth-child(5) { grid-area: 3 / 1; } .bottom .dot:nth-child(6) { grid-area: 3 / 3; } 
    
    .result { display: none; margin-top: 25px; animation: slideUp .6s; }
    .result.show { display: block; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .score-message { font-size: 1.5rem; font-weight: 900; color: var(--navy); }
  </style>
</head>
<body>
  <header class="container header-nav">
    <a href="tools.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg> بازگشت</a>
  </header>
  <main class="container">
    <div class="tool-card">
      <div class="icon-wrapper"><div class="icon-glow"></div><div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg></div></div>
      <h1>تاس سه بعدی</h1>
      <p class="sub">تاس بریز و ببین چند میاد!</p>
      
      <div class="dice-container">
        <div class="dice" id="dice">
          <div class="face front"><div class="dot"></div></div>
          <div class="face back"><div class="dot"></div><div class="dot"></div></div>
          <div class="face right"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          <div class="face left"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          <div class="face top"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          <div class="face bottom"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
      </div>
      
      <button class="btn" onclick="rollDice()">بریز!</button>
      
      <div class="result" id="result">
        <div class="score-message" id="resText"></div>
      </div>
    </div>
  </main>
  <script>
    const dice = document.getElementById('dice');
    const result = document.getElementById('result');
    const resText = document.getElementById('resText');
    let isRolling = false;
    
    const rotations = {
      1: { x: 0, y: 0 },
      2: { x: 0, y: 180 },
      3: { x: 0, y: -90 },
      4: { x: 0, y: 90 },
      5: { x: -90, y: 0 },
      6: { x: 90, y: 0 }
    };

    function rollDice() {
      if(isRolling) return;
      isRolling = true;
      result.classList.remove('show');
      
      const randomNum = Math.floor(Math.random() * 6) + 1;
      const target = rotations[randomNum];
      
      // ۵ دور کامل می‌چرخه و بعد می‌ایسته روی عدد
      const extraX = Math.floor(Math.random() * 2 + 3) * 360;
      const extraY = Math.floor(Math.random() * 2 + 3) * 360;
      
      dice.style.transform = `rotateX(${target.x + extraX}deg) rotateY(${target.y + extraY}deg)`;
      
      setTimeout(() => {
        isRolling = false;
        const emojis = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        resText.innerHTML = `عدد: <span style="font-size:3rem; color:var(--blue);">${emojis[randomNum]}</span>`;
        result.classList.add('show');
      }, 1000);
    }
  </script>
</body>
</html>
