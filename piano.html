<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>پیانو حرفه‌ای | فان لند</title>
  <link rel="icon" type="image/png" href="https://github.com/Ramtiossinbiki4444444/funland/blob/main/31e1d8bc-f0ca-4530-b1a4-ce16da108147.png?raw=true">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { 
      --blue: #1689e8; --blue-2: #0875d1; --blue-soft: #e8f4ff; --blue-line: #d7eaff; 
      --navy: #10263d; --text: #1b3045; --muted: #71849a; --bg: #f5f9ff; --border: #e5edf6; 
      --shadow: 0 25px 80px rgba(26, 86, 139, .12); --shadow-small: 0 10px 30px rgba(26, 86, 139, .06); 
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.8; min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, rgba(22,137,232,0.08) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(22,137,232,0.05) 0%, transparent 40%), var(--bg); }
    body::after { content: ""; position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(var(--blue-line) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.4; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }
    
    .container { width: min(850px, calc(100% - 30px)); margin-inline: auto; }
    .header-nav { padding: 24px 0 10px; display: flex; align-items: center; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); text-decoration: none; font-size: 0.92rem; font-weight: 800; transition: all 0.3s; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: var(--shadow-small); }
    .back-btn:hover { color: var(--blue-2); transform: translateX(5px); box-shadow: 0 12px 25px rgba(22,137,232,0.12); border-color: var(--blue-line); background: #fff; }
    .back-btn svg { width: 18px; height: 18px; transition: transform 0.3s; }
    .back-btn:hover svg { transform: translateX(-3px); }
    
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 50px; padding-top: 10px; }
    .tool-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 32px; padding: 40px 25px; box-shadow: var(--shadow); text-align: center; position: relative; width: 100%; }
    .tool-card::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); opacity: 0.6; }
    
    .icon-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 24px; display: grid; place-items: center; }
    .icon-glow { position: absolute; inset: -10px; background: var(--blue-soft); border-radius: 50%; filter: blur(15px); opacity: 0.8; animation: pulse-glow 3s infinite alternate; }
    .icon-box { width: 80px; height: 80px; background: #fff; color: var(--blue); border: 1px solid var(--blue-line); border-radius: 24px; display: grid; place-items: center; position: relative; z-index: 1; box-shadow: 0 10px 25px rgba(22,137,232,0.15); }
    .icon-box svg { width: 38px; height: 38px; }
    @keyframes pulse-glow { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0.9; } }
    
    h1 { margin: 0 0 10px; font-size: 1.8rem; color: var(--navy); font-weight: 900; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 30px; color: var(--muted); font-size: 0.95rem; }
    
    /* ======= طراحی پیانو با متد Key Group ======= */
    .piano-wrapper { 
      display: flex; 
      width: 100%; 
      height: 240px; 
      position: relative; 
      direction: ltr; 
      gap: 4px; 
      padding: 0 5px;
      margin-top: 20px;
      user-select: none;
    }
    
    .key-group { 
      flex: 1; 
      position: relative; 
      height: 100%; 
    }
    
    .white-key { 
      width: 100%; 
      height: 100%; 
      background: #fff; 
      border: 1px solid var(--border); 
      border-radius: 0 0 12px 12px; 
      display: flex; 
      align-items: flex-end; 
      justify-content: center; 
      padding-bottom: 15px; 
      font-weight: 900; 
      font-size: 1rem; 
      color: var(--blue); 
      box-shadow: 0 6px 0 var(--border); 
      cursor: pointer; 
      transition: 0.1s; 
    }
    
    .white-key:active, .white-key.active { 
      transform: translateY(6px); 
      box-shadow: 0 0 0 var(--border); 
      background: var(--blue-soft); 
    }
    
    .black-key { 
      position: absolute; 
      top: 0; 
      right: -30%; /* چسبیده به لبه راست کلید سفید */
      width: 60%; 
      height: 60%; 
      background: var(--navy); 
      border: 2px solid #000;
      border-top: none;
      border-radius: 0 0 8px 8px; 
      z-index: 2; 
      box-shadow: 0 5px 0 #000; 
      cursor: pointer; 
      transition: 0.1s; 
      display: flex; 
      align-items: flex-end; 
      justify-content: center; 
      padding-bottom: 10px; 
      color: #fff; 
      font-weight: 900; 
      font-size: 0.8rem; 
    }
    
    .black-key:active, .black-key.active { 
      transform: translateY(5px); 
      box-shadow: 0 0 0 #000; 
      background: #1e3b5c; 
    }

    @media (max-width: 600px) { 
      .piano-wrapper { height: 160px; gap: 2px; padding: 0 2px; } 
      .white-key { font-size: 0.8rem; padding-bottom: 10px; border-radius: 0 0 8px 8px; }
      .black-key { font-size: 0.6rem; padding-bottom: 8px; width: 64%; right: -32%; }
    }
  </style>
</head>
<body>
  <header class="container header-nav">
    <a href="tools.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7 7-7-7 7-7"/></svg> بازگشت</a>
  </header>
  
  <main class="container">
    <div class="tool-card">
      <div class="icon-wrapper">
        <div class="icon-glow"></div>
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>
      
      <h1>پیانو حرفه‌ای</h1>
      <p class="sub">با کلیک یا کیبورد (A تا L) موزیک بزن!</p>
      
      <div class="piano-wrapper" id="piano">
        <!-- گروه ۱: دو -->
        <div class="key-group">
          <div class="white-key" data-note="C4" data-key="a">A</div>
          <div class="black-key" data-note="C#4" data-key="w">W</div>
        </div>
        <!-- گروه ۲: ر -->
        <div class="key-group">
          <div class="white-key" data-note="D4" data-key="s">S</div>
          <div class="black-key" data-note="D#4" data-key="e">E</div>
        </div>
        <!-- گروه ۳: می (بدون کلید سیاه) -->
        <div class="key-group">
          <div class="white-key" data-note="E4" data-key="d">D</div>
        </div>
        <!-- گروه ۴: فا -->
        <div class="key-group">
          <div class="white-key" data-note="F4" data-key="f">F</div>
          <div class="black-key" data-note="F#4" data-key="t">T</div>
        </div>
        <!-- گروه ۵: سل -->
        <div class="key-group">
          <div class="white-key" data-note="G4" data-key="g">G</div>
          <div class="black-key" data-note="G#4" data-key="y">Y</div>
        </div>
        <!-- گروه ۶: لا -->
        <div class="key-group">
          <div class="white-key" data-note="A4" data-key="h">H</div>
          <div class="black-key" data-note="A#4" data-key="u">U</div>
        </div>
        <!-- گروه ۷: سی (بدون کلید سیاه) -->
        <div class="key-group">
          <div class="white-key" data-note="B4" data-key="j">J</div>
        </div>
        <!-- گروه ۸: دو (اکتاو بعد) -->
        <div class="key-group">
          <div class="white-key" data-note="C5" data-key="k">K</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const frequencies = { 
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 
      'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 
      'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88, 
      'C5': 523.25 
    };
    
    // هندل کردن کلیک و لمس
    document.querySelectorAll('.white-key, .black-key').forEach(key => {
      key.addEventListener('mousedown', () => playNote(key.dataset.note, key));
      key.addEventListener('touchstart', (e) => { e.preventDefault(); playNote(key.dataset.note, key); });
    });

    // هندل کردن کیبورد
    document.addEventListener('keydown', e => {
      const keyEl = document.querySelector(`[data-key="${e.key.toLowerCase()}"]`);
      if(keyEl && !e.repeat) {
        playNote(keyEl.dataset.note, keyEl);
      }
    });

    let audioCtx = null;
    function playNote(note, el) {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // افکت فشرده شدن دکمه
      el.classList.add('active'); 
      setTimeout(() => el.classList.remove('active'), 150);
      
      const osc = audioCtx.createOscillator(); 
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle'; // صدای پیانو نرم‌تر و طبیعی‌تر
      osc.frequency.value = frequencies[note];
      
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      
      osc.connect(gain); 
      gain.connect(audioCtx.destination);
      
      osc.start(); 
      osc.stop(audioCtx.currentTime + 1.5);
    }
  </script>
</body>
</html>
